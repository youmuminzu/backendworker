[project]
name = "backendworker"
version = "0.1.0"
description = "数据导入端：把 data-collector 产出的数据同步进 Cloudflare D1 并维护 FTS5 索引"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "jieba>=0.42.1",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backendworker"]

[tool.uv]
default-groups = []
